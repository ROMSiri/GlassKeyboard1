name: UI check on emulator
on:
  workflow_dispatch:
    inputs:
      script:
        description: test script in tools/
        default: ui-check.sh
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch built APK
        run: |
          git fetch origin apk --depth 1
          git show origin/apk:GlassKeyboard.apk > /tmp/app.apk
          ls -la /tmp/app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/${{ inputs.script || 'ui-check.sh' }}
      - name: Publish screenshots to the "screens" branch
        if: always()
        run: |
          cd /tmp/shots || exit 0
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "UI check ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
