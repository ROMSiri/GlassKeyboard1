name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37" "platform-tools" > /dev/null || $SDKM --list | grep -i "platforms;android-3"
      - name: Emoji keywords from Unicode CLDR
        run: |
          mkdir -p /tmp/cldr
          for l in ru en; do
            curl -fsSL "https://raw.githubusercontent.com/unicode-org/cldr-json/main/cldr-json/cldr-annotations-full/annotations/$l/annotations.json" -o /tmp/cldr/$l.json || echo "no CLDR for $l"
          done
          python3 tools/emoji/build_emoji.py /tmp/cldr app/src/main/assets || echo "emoji index skipped"
          ls -la app/src/main/assets
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to the "apk" branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/release/app-release.apk /tmp/out/GlassKeyboard.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GlassKeyboard.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
