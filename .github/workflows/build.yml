name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37" "platform-tools" > /dev/null || $SDKM --list | grep -i "platforms;android-3"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: GlassKeyboard-apk
          path: app/build/outputs/apk/release/*.apk
